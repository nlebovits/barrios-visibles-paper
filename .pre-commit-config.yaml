# Hooks for the Barrios Visibles paper. Adapted from
# portolan-sdi/portolan-ops, minus the workflow and Python-package gates.
#
# Run with prek (https://github.com/j178/prek), the Rust pre-commit runner.
# pixi provides it:
#   pixi run prek install --hook-type pre-commit --hook-type commit-msg
#   pixi run lint
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The Apache license text stays verbatim. So do the imported research
      # notes in docs/: their field blocks rely on markdown hard line breaks,
      # which trailing-whitespace strips.
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            LICENSE
            |docs/barrios-visibles-annotated-literature-review\.md
            |docs/barrios-visibles-census-coverage-sources-and-notes\.md
            |docs/renabap-indec-source-notes\.md
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            LICENSE
            |docs/barrios-visibles-annotated-literature-review\.md
            |docs/barrios-visibles-census-coverage-sources-and-notes\.md
            |docs/renabap-indec-source-notes\.md
          )$
      - id: check-yaml
        # CITATION.cff is YAML. The hook matches .yaml and .yml by default,
        # so widen it by filename instead of by type.
        name: check yaml, CITATION.cff included
        types: [file]
        files: (\.ya?ml|CITATION\.cff)$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # The Vale styles list misspellings on purpose. docs/ holds audit
        # working notes that quote INDEC in Spanish and await a prose pass.
        exclude: |
          (?x)^(
            styles/
            |docs/
            |literature/index\.md$
            |literature/evidence-matrix\.csv$
          )

  # Prose rules. The styles live in styles/, and .vale.ini configures them.
  # `sync` fetches the pinned third-party packages; it takes no filenames.
  - repo: https://github.com/vale-cli/vale
    rev: v3.19.0
    hooks:
      - id: vale
        name: vale sync
        args: [sync]
        pass_filenames: false
      - id: vale
        args: [--output=line, --minAlertLevel=error]
        # docs/ is excluded for the reason given under codespell.
        # literature/index.md is generated by check_sources.py, so its prose
        # is assembled from table cells and is not written for a reader.
        exclude: |
          (?x)^(
            docs/
            |literature/index\.md$
          )

  # General English checks that do not overlap the Vale styles.
  - repo: https://github.com/amperser/proselint
    rev: v0.16.0
    hooks:
      - id: proselint
        args: [check, --config, proselint.json]
        types: [markdown]
        # paper/ is excluded for the same reason as the vale hook above. Its
        # one finding, "Very High-Resolution", is part of a published title.
        exclude: |
          (?x)^(
            \.claude/
            |paper/
            |docs/
            |literature/
          )

  # The source registry. `check_sources.py` validates the bibliography, the
  # per-source notes, every citation key, and every URL cited in docs/. It
  # runs inside the pixi environment because it imports pydantic and pyarrow.
  # The hook checks and never regenerates, so a commit cannot silently rewrite
  # the generated cross-reference. Run `pixi run sources-index` for that.
  - repo: local
    hooks:
      - id: check-sources
        name: source registry
        entry: pixi run -q python check_sources.py --quiet
        language: system
        pass_filenames: false
        files: ^(paper/|docs/|literature/|check_sources\.py$)
