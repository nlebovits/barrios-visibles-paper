[project]
name = "barrios-visibles-paper"
version = "0.0.0"
description = "Analysis code for the Barrios Visibles paper."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "prek>=0.2",
  "pytest>=8",
  "ruff>=0.16",
]

# The repo holds analysis code and prose, not an installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Spanish place and title words that the English dictionary reports.
# Add a word here when codespell flags correct Spanish.
[tool.codespell]
ignore-words-list = "visibles"

[tool.commitizen]
name = "cz_conventional_commits"
