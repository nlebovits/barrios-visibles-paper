# Hooks for the Barrios Visibles paper. Adapted from
# portolan-sdi/portolan-ops, minus the workflow and Python-package gates.
#
# Run with prek (https://github.com/j178/prek), the Rust pre-commit runner:
#   uvx prek install --hook-type pre-commit --hook-type commit-msg
#   uvx prek run --all-files
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The Apache license text stays verbatim.
      - id: trailing-whitespace
        exclude: ^LICENSE$
      - id: end-of-file-fixer
        exclude: ^LICENSE$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        # The Vale styles list misspellings on purpose.
        exclude: ^styles/

  # Prose rules. The styles live in styles/, and .vale.ini configures them.
  # `sync` fetches the pinned third-party packages; it takes no filenames.
  - repo: https://github.com/vale-cli/vale
    rev: v3.19.0
    hooks:
      - id: vale
        name: vale sync
        args: [sync]
        pass_filenames: false
      - id: vale
        args: [--output=line, --minAlertLevel=error]

  # General English checks that do not overlap the Vale styles.
  - repo: https://github.com/amperser/proselint
    rev: v0.16.0
    hooks:
      - id: proselint
        args: [check, --config, proselint.json]
        types: [markdown]
        exclude: ^\.claude/
