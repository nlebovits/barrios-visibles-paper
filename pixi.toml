[workspace]
authors = ["Nissim Lebovits <nlebovits@pm.me>"]
channels = ["conda-forge"]
name = "barrios-visibles-paper"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
estimate = "python estimate.py"
census-comparison = "python census_comparison.py"
dwelling-footprint = "python census_dwelling_footprint.py"
fetch-ms-buildings = "python fetch_ms_buildings.py"
diagnostic-multiplier = "python diagnostic_household_multiplier.py"
combined = "python combined_analysis.py"
dasymmetric = "python dasymmetric_allocation.py"
# Example maps of individual census radios inside RENABAP barrios. Reads
# the radio and barrio parquets from arg-bp-map and fetches Esri World
# Imagery tiles over the network.
tract-examples = "python tract_examples.py"
# Needs `-- --census-path /path/to/radios.parquet` and the per-radio output of
# dwelling-footprint. Reads Open Buildings Temporal GeoTIFFs over the network.
openbuildings-growth = "python openbuildings_growth.py"
reproduce = { depends-on = ["estimate", "census-comparison"] }
lint = "prek run --all-files"
# Source registry. `sources-check` validates paper/references.bib against the
# notes in paper/sources/ and every citation in paper/ and docs/. It never
# writes. `sources-index` regenerates literature/index.md,
# literature/evidence-matrix.csv, literature/schema.json, and the three
# parquet tables in outputs/.
sources-check = "python check_sources.py"
sources-index = "python check_sources.py --write"
# Render each paper for submission. xelatex comes from the system TeX
# installation, not from pixi, because a full TeX distribution would dwarf
# the rest of this environment. DejaVu carries the glyphs the papers use,
# such as the >= in the building-size filters, which Latin Modern lacks.
#
# --columns=24 makes pandoc give each table column a relative width. At the
# default of 72 it emits bare `l` columns, which never wrap, and the widest
# table ran 185pt past the right margin. autolink_bare_uris turns a bare URL
# in the reference list into a link, which paper/pdf-header.tex can break.
pdf-article = """pandoc paper/informal-settlements-argentina.md \
  -f markdown+autolink_bare_uris --columns=18 --citeproc \
  --include-in-header=paper/pdf-header.tex \
  -o outputs/barrios-visibles-data-and-policy.pdf --pdf-engine=xelatex \
  -V geometry:margin=1in -V linkcolor=blue -V fontsize=11pt \
  -V mainfont='DejaVu Serif' -V monofont='DejaVu Sans Mono'"""
pdf-part-i = { depends-on = ["pdf-article"] }
pdf-supplement = """pandoc paper/supplement.md \
  -f markdown+autolink_bare_uris --columns=18 \
  --include-in-header=paper/pdf-header.tex \
  -o outputs/barrios-visibles-supplement.pdf --pdf-engine=xelatex \
  -V geometry:margin=0.75in -V linkcolor=blue -V fontsize=10pt \
  -V mainfont='DejaVu Serif' -V monofont='DejaVu Sans Mono'"""
pdf-part-ii = """pandoc paper/barrios-visibles-part-ii.md \
  -f markdown+autolink_bare_uris --columns=24 \
  --include-in-header=paper/pdf-header.tex \
  -o outputs/barrios-visibles-part-ii.pdf --pdf-engine=xelatex \
  -V geometry:margin=1in -V linkcolor=blue -V fontsize=11pt \
  -V mainfont='DejaVu Serif' -V monofont='DejaVu Sans Mono'"""
pdf = { depends-on = ["pdf-article", "pdf-supplement"] }

[dependencies]
python = ">=3.11,<3.14"
pandoc = ">=3.1,<4"
duckdb = ">=1.5.2,<2"
pandas = ">=3.0.2,<4"
pyarrow = ">=23.0.1,<24"
requests = ">=2.32,<3"
matplotlib-base = ">=3.9,<4"
rasterio = ">=1.3,<2"
geopandas = ">=1.1.4,<2"
# check_sources.py imports these directly.
pydantic = ">=2.11,<3"
pyyaml = ">=6,<7"
contextily = ">=1.7.1,<2"

# geoparquet-io and prek publish to PyPI only.
[pypi-dependencies]
geoparquet-io = "*"
prek = "*"
matplotlib-map-utils = ">=4.1.1, <5"
lazycogs = ">=0.7.0, <0.8"
rustac = ">=0.9.17, <0.10"
